apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-backend
  template:
    metadata:
      labels:
        app: resilience-backend
    spec:
      containers:
        - name: backend
          image: resilience-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DSN
              value: postgresql+asyncpg://postgres:postgres@postgres:5432/resilience
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-backend
spec:
  selector:
    app: resilience-backend
  ports:
    - port: 8000
      targetPort: 8000
